<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | Kelly Jao Quidit</title>
  <meta name="description" content="Portfolio of Kelly Jao D. Quidit, an aspiring network engineer and Bachelor of Science in Information Technology student (Network Design and Management) from Nueva Vizcaya.">
  <meta name="author" content="Kelly Jao D. Quidit">

  <!-- Link previews -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Home | Kelly Jao Quidit">
  <meta property="og:description" content="Portfolio of Kelly Jao D. Quidit, an aspiring network engineer and Bachelor of Science in Information Technology student (Network Design and Management) from Nueva Vizcaya.">

  <!-- Favicon (final): inline SVG, white "K" on the accent blue -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='18' font-weight='700' text-anchor='middle' fill='white'%3EK%3C/text%3E%3C/svg%3E">

  <!-- Apply saved theme before first paint (prevents a light/dark flash) -->
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }
    } catch (e) {}
  </script>

  <!-- Fonts: Plus Jakarta Sans (headings), DM Sans (body) -- self-hosted via @fontsource, imported in css/input.css, bundled into css/tailwind.css -->
  <!-- Tailwind (v4 CLI). css/tailwind.css is generated by `npm run build`; do not edit it by hand. -->
  <link rel="stylesheet" href="css/tailwind.css">

  <!-- Custom CSS (after Tailwind) -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Shared navbar and footer (plain script, no defer, so they render with the page) -->
  <script src="js/icons.js"></script>
  <script src="js/components.js"></script>
</head>
<body class="font-sans bg-page text-ink min-h-screen flex flex-col">



  <site-header></site-header>

  <main id="main" class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 sm:px-6">
    <!-- Hero: headline (the page's h1), role, tagline, buttons. Text left, photo right (photo hidden on mobile). Each piece fades in one after another (.hero-in, --i sets the order). -->
    <section aria-labelledby="hero-heading" class="grid items-center gap-10 md:min-h-112 md:grid-cols-[3fr_2fr] md:gap-12">
      <div>
        <p style="--i:0" class="hero-in inline-flex items-center gap-2 rounded-full bg-badge px-3 py-1 text-xs font-medium text-badge-ink">
          <site-icon name="briefcase" class="h-3.5 w-3.5"></site-icon>Open to work
        </p>
        <h1 id="hero-heading" style="--i:1" class="hero-in mt-6 font-heading text-4xl font-bold leading-tight tracking-tight sm:text-5xl">
          Hi, I'm <span class="text-accent">Kelly Jao D. Quidit</span>
        </h1>
        <p style="--i:2" class="hero-in mt-4 font-heading text-lg font-semibold">Aspiring Network Engineer</p>
        <p style="--i:3" class="hero-in mt-2 max-w-xl text-muted">I'm learning to design, set up, and troubleshoot reliable networks, and I'm always improving my skills.</p>

        <div style="--i:4" class="hero-in mt-8 grid grid-cols-2 gap-3 md:flex md:flex-wrap">
          <a href="projects.html" class="inline-flex items-center justify-center gap-2 rounded-lg bg-accent px-4 py-3 md:px-6 text-sm font-medium text-white transition duration-200 hover:opacity-90 motion-reduce:transition-none active:scale-95 motion-reduce:active:scale-100">
            <site-icon name="folder-open" class="h-4 w-4"></site-icon>View Projects
          </a>
          <a href="about.html" class="inline-flex items-center justify-center gap-2 rounded-lg border border-line px-4 py-3 md:px-6 text-sm font-medium transition duration-200 hover:border-accent hover:text-accent motion-reduce:transition-none active:scale-95 motion-reduce:active:scale-100">
            <site-icon name="user" class="h-4 w-4"></site-icon>About Me
          </a>
        </div>
      </div>

      <!-- Photo with placeholder fallback (same pattern as About and Projects) -->
      <div style="--i:1" class="hero-in hidden md:block">
        <div class="relative mx-auto flex aspect-square w-full max-w-xs items-center justify-center overflow-hidden rounded-xl border border-line bg-accent-soft text-accent md:max-w-none">
          <site-icon name="user" class="h-16 w-16"></site-icon>
          <img src="assets/images/profile.jpg" alt="Portrait of Kelly Jao D. Quidit" loading="lazy" decoding="async"
               class="absolute inset-0 h-full w-full object-cover" onerror="this.style.display='none'">
        </div>
      </div>
    </section>
  </main>

  <site-footer></site-footer>

  <script src="js/main.js"></script>
</body>
</html>
